apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  labels:
    app: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "postgres://postgres:postgres@postgres.database.svc.cluster.local:5432/app?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: LOG_LEVEL
              value: "ERROR"
            - name: OTLP_ENDPOINT
              value: "vmsingle.observability.svc.cluster.local:4317"
            - name: GOMEMLIMIT
              value: "110MiB"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
