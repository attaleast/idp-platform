---
apiVersion: v1
kind: Namespace
metadata:
  name: developer-portal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: developer-portal
data:
  app-config.yaml: |
    app:
      baseUrl: https://portal.attalea.pw
      title: IDP Portal
    backend:
      baseUrl: https://portal.attalea.pw
      cors:
        origin: https://portal.attalea.pw
        credentials: true
      auth:
        keys:
          - secret: "bruhbruhbruh"
    organization:
      name: IDP Team
    auth:
      environment: production
      providers:
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: developer-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/attaleast/idp-backstage:latest
          ports:
            - containerPort: 7007
          env:
            - name: AUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-auth-secrets
                  key: AUTH_GITHUB_CLIENT_ID
            - name: AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-auth-secrets
                  key: AUTH_GITHUB_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /app/app-config.from-configmap.yaml
              subPath: app-config.yaml
          args:
            - "--config"
            - "/app/app-config.yaml"
            - "--config"
            - "/app/app-config.from-configmap.yaml"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: developer-portal
spec:
  selector:
    app: backstage
  ports:
    - port: 7007
      targetPort: 7007
