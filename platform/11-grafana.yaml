apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 8.6.0
    helm:
      values: |
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        persistence:
          enabled: false

        admin:
          existingSecret: "grafana-secrets"
          secretKeys:
            adminUserKey: "admin-user"
            adminPasswordKey: "admin-password"

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                type: prometheus
                url: http://vmsingle-vms-stack-victoria-metrics-k8s-stack.observability.svc.cluster.local:8429
                access: proxy
                isDefault: true
              - name: Loki
                type: loki
                url: http://loki.observability.svc.cluster.local:3100
                access: proxy

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            k8s-cluster:
              gnetId: 15760               
              revision: 1
              datasource: VictoriaMetrics
            logs-app:
              gnetId: 13639 # Logs / App
              revision: 1
              datasource: Loki
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
