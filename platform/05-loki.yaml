apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.6.0
    helm:
      values: |
        deploymentMode: SingleBinary

        loki:
          commonConfig:
            replication_factor: 1
          useTestSchema: true
          storage:
            bucketNames:
              chunks: ${S3_BUCKET}
              ruler: ${S3_BUCKET}
              admin: ${S3_BUCKET}
            s3:
              endpoint: ${S3_ENDPOINT}
              region: ${S3_REGION}
              accessKeyId: ${S3_ACCESS_KEY_ID}
              secretAccessKey: ${S3_SECRET_ACCESS_KEY}

        singleBinary:
          replicas: 1
          resources:
            requests:
              memory: 128Mi
          extraEnv:
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_REGION
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_SECRET_KEY

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
