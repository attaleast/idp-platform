apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 18.7.1
    chart: loki
    helm:
      releaseName: loki
      values: |
        deploymentMode: Monolithic

        minio:
          enabled: false

        loki:
          auth_enabled: true

          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: s3
            bucketNames:
              chunks: ca9df933fb84-attalea-cloud-s3
              ruler: ca9df933fb84-attalea-cloud-s3
              admin: ca9df933fb84-attalea-cloud-s3
            s3:
              endpoint: s3.ru1.storage.beget.cloud
              region: ru-central1
              s3ForcePathStyle: true
              existingSecret: s3-secret
              existingSecretKeys:
                accessKeyId: "S3_ACCESS_KEY"
                secretAccessKey: "S3_SECRET_KEY"

          limits_config:
            retention_period: 672h
            allow_structured_metadata: true
            volume_enabled: true

          querier:
            max_concurrent: 4

        singleBinary:
          replicas: 3
          persistence:
            storageClass: gp2
            accessModes:
              - ReadWriteOnce
            size: 30Gi


        distributor:   { replicas: 0 }
        ingester:      { replicas: 0 }
        querier:       { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler: { replicas: 0 }
        compactor:     { replicas: 0 }
        indexGateway:  { replicas: 0 }
        bloomPlanner:  { replicas: 0 }
        bloomBuilder:  { replicas: 0 }
        bloomGateway:  { replicas: 0 }
        backend:       { replicas: 0 }
        read:          { replicas: 0 }
        write:         { replicas: 0 }

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
