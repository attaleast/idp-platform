apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.6.0
    helm:
      values: |
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          resources:
            requests:
              memory: 128Mi
          extraEnvFrom:
            - secretRef:
                name: loki-s3-secret
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
          type: filesystem
        loki:
          useTestSchema: true
          storage:
            bucketNames:
              chunks: ${S3_BUCKET}
              ruler: ${S3_BUCKET}
              admin: ${S3_BUCKET}
            s3:
              endpoint: ${S3_ENDPOINT}
              region: ${S3_REGION}
              accessKeyId: ${S3_ACCESS_KEY_ID}
              secretAccessKey: ${S3_SECRET_ACCESS_KEY}
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
