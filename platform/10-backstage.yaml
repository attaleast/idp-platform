apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    chart: backstage
    repoURL: https://backstage.github.io/charts
    targetRevision: 2.0.0
    helm:
      parameters:
        - name: backstage.image.registry
          value: "ghcr.io"
        - name: backstage.image.repository
          value: "backstage/backstage"
        - name: backstage.image.tag
          value: "latest"
        - name: backstage.resources.requests.memory
          value: "256Mi"
        - name: backstage.resources.limits.memory
          value: "512Mi"
        - name: backstage.appConfig.database.client
          value: "better-sqlite3"
  destination:
    server: https://kubernetes.default.svc
    namespace: developer-portal
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
