apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    chart: backstage
    repoURL: https://backstage.github.io/charts
    targetRevision: 2.8.2
    helm:
      parameters:
        - name: backstage.image.registry
          value: "ghcr.io"
        - name: backstage.image.repository
          value: "backstage/backstage"
        - name: backstage.image.tag
          value: "1.24.0"
        - name: backstage.resources.requests.memory
          value: "256Mi"
        - name: backstage.resources.limits.memory
          value: "512Mi"
        - name: backstage.appConfig.database.client
          value: "better-sqlite3"
      values: |
        backstage:
          appConfig:
            app:
              baseUrl: https://portal.attalea.pw
              title: IDP Portal
            backend:
              baseUrl: https://portal.attalea.pw
              cors:
                origin: https://portal.attalea.pw
                credentials: true
              auth:
                keys:
                  - secret: "bruhbruhbruh"
            organization:
              name: Platform Team
            auth:
              environment: production
              providers:
                github:
                  production:
                    clientId: ${AUTH_GITHUB_CLIENT_ID}
                    clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            techdocs:
              builder: 'local'
              generator:
                runIn: 'local'
              publisher:
                type: 'local'
          extraEnvVarsSecrets:
            - github-auth-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: developer-portal
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
